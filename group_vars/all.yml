# ---- System services to enable (systemd, root) ------------------
# Curated from the source machine. Machine-specific units
# (e.g. trackpoint-fix) are intentionally left out.
system_services:
  - bluetooth.service
  - docker.service
  - NetworkManager.service
  - sddm.service
  - systemd-timesyncd.service
  - tailscaled.service

# Optional services — installed on the source box but NOT auto-enabled.
# Enable by moving into system_services above if you want them:
#   - snapd.service            # was enabled on source
#   - snapd.apparmor.service   # was enabled on source
#   - teamviewerd.service      # was enabled on source
#   - tlp.service              # laptop power mgmt (conflicts with power-profiles-daemon)
#   - power-profiles-daemon.service
system_services_optional: []

# ---- User services to enable (systemd --user) -------------------
user_services:
  - pipewire.socket
  - pipewire-pulse.socket
  - wireplumber.service
  - gnome-keyring-daemon.socket

# ---- Extra groups the user should belong to --------------------
user_groups:
  - wheel
  - docker
