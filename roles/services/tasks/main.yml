---
# Enable (and start) system + user services.

- name: Enable system services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ system_services + system_services_optional }}"
  register: services_svc_result
  failed_when:
    - services_svc_result is failed
    - "'Could not find the requested service' not in (services_svc_result.msg | default(''))"

- name: Enable user services (systemd --user)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    scope: user
  loop: "{{ user_services }}"
  register: services_usvc_result
  failed_when:
    - services_usvc_result is failed
    - "'Could not find the requested service' not in (services_usvc_result.msg | default(''))"
