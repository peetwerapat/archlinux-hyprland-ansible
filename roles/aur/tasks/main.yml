---
# Bootstrap the `yay` AUR helper (if missing), then install AUR packages.
# makepkg/yay must NOT run as root — everything here runs as the login user.

- name: Check whether yay is already installed
  ansible.builtin.command: which yay
  register: yay_check
  changed_when: false
  failed_when: false

- name: Bootstrap yay from the AUR
  when: yay_check.rc != 0
  block:
    - name: Ensure git + base-devel are present (needed to build yay)
      become: true
      community.general.pacman:
        name:
          - git
          - base-devel
        state: present

    - name: Clone yay-bin PKGBUILD
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay-bin.git
        dest: /tmp/yay-bin
        version: master

    - name: Build and install yay (makepkg -si)
      ansible.builtin.command:
        cmd: makepkg -si --noconfirm
        chdir: /tmp/yay-bin
      # makepkg internally calls sudo pacman -U; --ask-become-pass supplies the password.

- name: Install AUR packages via yay
  ansible.builtin.command:
    cmd: "yay -S --needed --noconfirm {{ aur_packages | join(' ') }}"
  register: yay_install
  changed_when: "'there is nothing to do' not in yay_install.stdout"
  when: aur_packages | length > 0
