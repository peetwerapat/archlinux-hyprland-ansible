---
# Deploy the config snapshot taken from the source machine.
# Files live under roles/dotfiles/files/{config,home,wallpaper}.
# Symlinks were dereferenced at capture time, so everything here is real
# content — the machine no longer keeps a separate ~/dotfiles tree.

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config"
    state: directory
    mode: "0755"

- name: Back up an existing ~/.config before first deploy
  ansible.builtin.command:
    cmd: "cp -a {{ ansible_env.HOME }}/.config {{ ansible_env.HOME }}/.config.bak-ansible"
    creates: "{{ ansible_env.HOME }}/.config.bak-ansible"

- name: Deploy ~/.config/* dotfiles
  ansible.posix.synchronize:
    src: "files/config/"
    dest: "{{ ansible_env.HOME }}/.config/"
    archive: true
    recursive: true
  # `synchronize` runs rsync locally when ansible_connection=local.

- name: Deploy home-directory dotfiles (.zshrc, .zprofile, ...)
  ansible.posix.synchronize:
    src: "files/home/"
    dest: "{{ ansible_env.HOME }}/"
    archive: true
    recursive: true

# --- things the configs expect to exist -------------------------------

- name: Ensure the wallpaper folder exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/wallpaper"
    state: directory
    mode: "0755"

- name: Seed the default wallpaper
  ansible.builtin.copy:
    src: "wallpaper/DesktopBG.jpeg"
    dest: "{{ ansible_env.HOME }}/wallpaper/DesktopBG.jpeg"
    mode: "0644"
    force: false
  # hypr/scripts/wallpaper*.sh fall back to this file.

- name: Ensure the wallpaper cache folder exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.cache/wallpaper"
    state: directory
    mode: "0755"

- name: Make the hypr and waybar scripts executable
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/{{ item }}"
    mode: "0755"
  loop:
    - hypr/scripts/cleanup.sh
    - hypr/scripts/cliphist.sh
    - hypr/scripts/gamemode.sh
    - hypr/scripts/gesture-debug.sh
    - hypr/scripts/gtk.sh
    - hypr/scripts/kb-layout.sh
    - hypr/scripts/keybindings.sh
    - hypr/scripts/loadconfig.sh
    - hypr/scripts/monitor-mode.sh
    - hypr/scripts/nm-applet.sh
    - hypr/scripts/power.sh
    - hypr/scripts/screenshot.sh
    - hypr/scripts/toggle-animations.sh
    - hypr/scripts/volume-menu.sh
    - hypr/scripts/wallpaper.sh
    - hypr/scripts/wallpaper-restore.sh
    - hypr/scripts/wifi-menu.sh
    - hypr/scripts/wlogout.sh
    - hypr/scripts/xdg.sh
    - waybar/launch.sh
    - waybar/toggle.sh
    - waybar/scripts/trackpad-battery.py
    - nwg-dock-hyprland/launch.sh

- name: Ensure ~/.vim exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.vim"
    state: directory
    mode: "0755"

- name: Point ~/.vim/vimrc at the copy in ~/.config
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.config/vim/vimrc"
    dest: "{{ ansible_env.HOME }}/.vim/vimrc"
    state: link
    force: true
  # vim on Arch does not read $XDG_CONFIG_HOME/vim/vimrc on its own.

- name: Generate the color palette from the wallpaper
  ansible.builtin.command:
    cmd: "{{ ansible_env.HOME }}/.cargo/bin/matugen image {{ ansible_env.HOME }}/wallpaper/DesktopBG.jpeg -m dark"
  changed_when: true
  # Same absolute path hypr/scripts/wallpaper.sh uses — the pinned 2.4.1
  # cargo build installed by the `matugen` role, not the 4.x repo package.
  # Writes the waybar / rofi / swaync / kitty / gtk / qt6ct / hyprland color
  # files. waypaper re-runs it (post_command) on every wallpaper change.
