# kitty user overrides (kept empty on purpose)

# solid black to match nvim's Normal bg (#000000), so the
# padding around nvim is not a gray frame
background            #000000
background_image      none
background_opacity    1.0

# tab bar: dim inactive pills on the black bar
# (active tab colors come from colors-matugen.conf)
tab_bar_background      #000000
tab_bar_margin_color    #000000
inactive_tab_foreground #7f849c
inactive_tab_background #16181d
