# kitty :: minimal

# ---------- Font ----------
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

# ---------- Window ----------
remember_window_size        no
initial_window_width        950
initial_window_height       500
window_padding_width        10 
hide_window_decorations     yes
confirm_os_window_close     0
background_opacity          0.94
dynamic_background_opacity  no

# the blurred wallpaper, heavily tinted, as a backdrop
background_image            ~/.cache/wallpaper/blurred.png
background_image_layout     scaled
background_image_linear     yes
background_tint             0.94
background_tint_gaps        1.0

# ---------- Cursor ----------
cursor_shape                beam
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
cursor_trail                0

# ---------- Behaviour ----------
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
selection_foreground        none

# ---------- Tab bar (custom pills, see tab_bar.py) ----------
tab_bar_edge                top
tab_bar_style               custom
tab_bar_align               left
tab_bar_min_tabs            2
tab_bar_margin_width        6.0
tab_bar_margin_height       6.0 4.0
tab_title_max_length        40
active_tab_font_style       bold
inactive_tab_font_style     normal

# ---------- Colors ----------
# Muted base palette, then the wallpaper-derived
# background / foreground on top (written by matugen).
include themes/cyberdream.conf
include ./colors-matugen.conf

# ---------- Local overrides ----------
include ./custom.conf
