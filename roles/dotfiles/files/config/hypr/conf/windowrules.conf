# -----------------------------------------------------
# Window rules (Hyprland 0.56 syntax:
#   windowrule = <field> <value>, match:<prop> <regex>)
# -----------------------------------------------------

# ---------- Floating utility windows ----------
windowrule = float true, match:class ^(pavucontrol)$
windowrule = float true, match:class ^(blueman-manager)$
windowrule = float true, match:class ^(nm-connection-editor)$
windowrule = float true, match:class ^(gnome-calculator|org\.gnome\.Calculator)$

# ---------- Popup terminals (htop / nmtui from waybar) ----------
windowrule = float true, match:class ^(floating-term)$
windowrule = size 1000 700, match:class ^(floating-term)$
windowrule = center true, match:class ^(floating-term)$

# ---------- Picture-in-Picture ----------
windowrule = float true, match:title ^(Picture-in-Picture)$
windowrule = pin true, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$
windowrule = move 100%-w-24 100%-h-24, match:title ^(Picture-in-Picture)$

# ---------- Keep the screen awake in fullscreen ----------
windowrule = idle_inhibit fullscreen, match:class .*
