# -----------------------------------------------------
# Apple Magic Trackpad (Hyprland 0.56.0)
# Device names come from: hyprctl devices
# -----------------------------------------------------

# === Touchpad defaults (all touchpads) ===
input:touchpad:natural_scroll        = true
input:touchpad:tap-to-click          = true
input:touchpad:tap-and-drag          = true
input:touchpad:drag_lock             = true
input:touchpad:disable_while_typing  = false
input:touchpad:clickfinger_behavior  = true   # 2 fingers = RMB, 3 fingers = MMB (macOS style)
input:touchpad:middle_button_emulation = false
input:touchpad:scroll_factor         = 1.2

# -----------------------------------------------------
# Per-device: Apple Magic Trackpad
# -----------------------------------------------------
device {
    name              = apple-inc.-magic-trackpad
    enabled           = true
    accel_profile     = adaptive
    sensitivity       = 0.3      # <-- tune pointer speed here, range -1.0 .. 1.0
    scroll_factor     = 1.0      # <-- tune scroll speed here
    natural_scroll    = true
    tap-to-click      = true
    tap-and-drag      = true
    drag_lock         = true
    clickfinger_behavior   = true
    middle_button_emulation = false
    disable_while_typing   = false
}

# -----------------------------------------------------
# Gesture tuning
# -----------------------------------------------------
gestures {
    workspace_swipe_distance            = 300   # finger travel per workspace (lower = more sensitive)
    workspace_swipe_invert              = true  # natural-scroll direction (macOS style)
    workspace_swipe_cancel_ratio        = 0.2   # short swipes still commit
    workspace_swipe_min_speed_to_force  = 5     # a fast flick switches immediately
    workspace_swipe_direction_lock      = true
    workspace_swipe_forever             = true  # keep swiping without lifting fingers
    workspace_swipe_use_r               = true  # only cycle workspaces that exist on that monitor
    workspace_swipe_create_new          = true  # required, or swiping past the last workspace does nothing
}

# -----------------------------------------------------
# Gestures  (0.5x syntax: gesture = <fingers>, <direction>, [mod: MOD], [scale: N], <action>, [args])
#   direction : left / right / up / down / horizontal / vertical / swipe / pinch / pinchin / pinchout
#   action    : workspace | special | move | resize | close | fullscreen | float
#               | cursorZoom | scrollMove | dispatcher
# -----------------------------------------------------

# 3 fingers left/right -> switch workspace (= Swipe between Spaces)
gesture = 3, horizontal, workspace

# 3 fingers up -> window switcher (= Mission Control)
gesture = 3, up, dispatcher, exec, pkill -x rofi || rofi -show window -replace -i

# 3 fingers down -> Notification Center
gesture = 3, down, dispatcher, exec, swaync-client -t -sw

# 4 fingers pinch in -> app launcher (= Launchpad)
gesture = 4, pinchin, dispatcher, exec, pkill -x rofi || rofi -show drun -replace -i

# 4 fingers pinch out -> jump to an empty workspace (= Show Desktop)
gesture = 4, pinchout, dispatcher, workspace, empty

# 4 fingers left/right -> drag the active window across workspaces
gesture = 4, horizontal, move

# 4 fingers up -> fullscreen the active window
gesture = 4, up, fullscreen

# --- Optional, uncomment to enable ---
# gesture = 4, down, close                 # 4 fingers down = close window (easy to trigger by accident)
# gesture = 3, pinchin, float              # 3-finger pinch = toggle floating
# gesture = 4, vertical, special, magic    # 4 fingers vertical = scratchpad
# gesture = 2, pinch, cursorZoom           # 2-finger pinch = zoom the whole screen
#   ^ leave this off if you want pinch-to-zoom inside browsers/apps to keep working

# -----------------------------------------------------
# Built-in touchpad (moved here from keyboard.conf, syntax fixed)
# It used to be written as `device = name:key,value`, which Hyprland does not parse
# -----------------------------------------------------
device {
    name          = ps/2-synaptics-touchpad
    accel_profile = flat
    sensitivity   = 1.0    # was 3, outside the -1.0 .. 1.0 range, so it got clamped
    scroll_factor = 3.0
}
