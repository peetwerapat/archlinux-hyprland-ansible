# -----------------------------------------------------
# Monitor Setup
# name: Default (= Mode A of scripts/monitor-mode.sh)
#
# LG 27GL850  -> laptop HDMI (HDMI-A-2, Intel GPU)
# Samsung S24 -> Dell D6000 (DisplayLink, DVI-I-N)
#
# External monitors are matched by description because
# DisplayLink connector names change on every replug.
#
# ┌──────┐ ┌──────────────────────────┐ ┌────────────────┐
# │ S24  │ │        LG 27GL850        │ │     eDP-1      │
# │  ↕   │ │     2560x1440 @ 60       │ │    1920x1080   │
# └──────┘ └──────────────────────────┘ └────────────────┘
#  -1080x0            0x0                     2560x0
# -----------------------------------------------------

# fallback (monitor unplugged / remote)
monitor = ,preferred,auto,1

# Laptop panel (right)
#monitor = eDP-1,1920x1080@60,2560x0,1

# LG 27GL850 (center, main)
monitor = desc:LG Electronics 27GL850 009INRC1C502,2560x1440@59.95,0x0,1

# Samsung S24R35x (left, vertical) — 60Hz, DisplayLink flickers above that
#monitor = desc:Samsung Electric Company S24R35x H4TMA01205,1920x1080@60,-1080x0,1,transform,1

# AQ_MGPU_NO_EXPLICIT is exported in ~/.zprofile
# (aquamarine reads them before this config is parsed).
