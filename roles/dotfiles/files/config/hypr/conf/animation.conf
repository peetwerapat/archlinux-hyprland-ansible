# -----------------------------------------------------
# Animations :: smooth
# Two curves: a soft ease-out for most things and a small
# overshoot for windows opening.
# -----------------------------------------------------

animations {
    enabled = true

    bezier = smooth, 0.25, 1.0, 0.3, 1.0
    bezier = overshoot, 0.2, 1.2, 0.3, 1.0
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 4, overshoot, popin 90%
    animation = windowsIn, 1, 4, overshoot, popin 90%
    animation = windowsOut, 1, 3, smooth, popin 92%
    animation = windowsMove, 1, 4, smooth
    animation = border, 1, 8, smooth
    animation = borderangle, 1, 60, linear, once
    animation = fade, 1, 4, smooth
    animation = layers, 1, 4, smooth, fade
    animation = workspaces, 1, 5, smooth, slidefade 20%
}
