# -----------------------------------------------------
# Layer rules :: blur for the shell surfaces (Hyprland 0.56 syntax)
# Lets waybar / swaync / rofi sit on a translucent, blurred
# backdrop instead of a flat opaque strip.
# -----------------------------------------------------

layerrule = blur true, ignore_alpha 0.2, match:namespace ^(waybar)$
layerrule = blur true, ignore_alpha 0.2, match:namespace ^(swaync-control-center)$
layerrule = blur true, ignore_alpha 0.2, match:namespace ^(swaync-notification-window)$
layerrule = blur true, ignore_alpha 0.2, match:namespace ^(rofi)$
