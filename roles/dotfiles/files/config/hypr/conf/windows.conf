# -----------------------------------------------------
# General / windows :: blue glass
# 2px gradient border in the blue accent, roomy gaps.
# Palette comes from ~/.config/hypr/colors.conf (matugen).
# -----------------------------------------------------

general:layout = dwindle
general:gaps_in = 8
general:gaps_out = 14
general:border_size = 2
general:resize_on_border = true
general:allow_tearing = false

general:col.active_border = $accent $accent_container 45deg
general:col.inactive_border = $surface_container_high
