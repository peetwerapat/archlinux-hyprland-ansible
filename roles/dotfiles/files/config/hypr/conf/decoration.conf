# -----------------------------------------------------
# Decoration :: blue glass
# Deeper blur, soft blue-black shadow, gentle dim on the
# windows you are not using.
# -----------------------------------------------------

decoration:rounding = 12
decoration:rounding_power = 3.0

decoration:blur:enabled = true
decoration:blur:size = 6
decoration:blur:passes = 3
decoration:blur:new_optimizations = true
decoration:blur:noise = 0.012
decoration:blur:vibrancy = 0.20
decoration:blur:vibrancy_darkness = 0.05
decoration:blur:brightness = 1.0
decoration:blur:contrast = 1.05

decoration:shadow:enabled = true
decoration:shadow:range = 24
decoration:shadow:render_power = 3
decoration:shadow:offset = 0 6
decoration:shadow:color = rgba(05080fbb)
decoration:shadow:color_inactive = rgba(05080f66)

decoration:active_opacity = 1.0
decoration:inactive_opacity = 0.97
decoration:dim_inactive = true
decoration:dim_strength = 0.08
