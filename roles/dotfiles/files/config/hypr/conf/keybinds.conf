# -----------------------------------------------------
# Key bindings (Hyprland 0.53.0)
# ML4W compatible
# -----------------------------------------------------

# === Variables ===
$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/ml4w/scripts

# -----------------------------------------------------
# Applications
# -----------------------------------------------------
bind = $mainMod, RETURN, exec, ~/.config/ml4w/settings/terminal.sh
bind = $mainMod, B, exec, ~/.config/ml4w/settings/browser.sh
bind = $mainMod, E, exec, ~/.config/ml4w/settings/filemanager.sh
bind = $mainMod CTRL, E, exec, ~/.config/ml4w/settings/emojipicker.sh
bind = $mainMod CTRL, C, exec, ~/.config/ml4w/settings/calculator.sh

# -----------------------------------------------------
# Windows
# -----------------------------------------------------
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, workspaceopt, allfloat
#bind = $mainMod CTRL, J, togglesplit

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, u
bind = $mainMod, K, movefocus, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, L, resizeactive, 100 0
bind = $mainMod SHIFT, H, resizeactive, -100 0
bind = $mainMod SHIFT, K, resizeactive, 0 100
bind = $mainMod SHIFT, J, resizeactive, 0 -100

bind = $mainMod, G, togglegroup
bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, L, swapwindow, r
bind = $mainMod ALT, J, swapwindow, u
bind = $mainMod ALT, K, swapwindow, d

# ALT+Tab behavior (เหมือนเดิม)
binde = ALT, Tab, cyclenext
binde = ALT, Tab, bringactivetotop

# -----------------------------------------------------
# Actions
# -----------------------------------------------------
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod SHIFT, A, exec, $HYPRSCRIPTS/toggle-animations.sh
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh
bind = $mainMod SHIFT, S, exec, $HYPRSCRIPTS/screenshot.sh
bind = $mainMod CTRL, Q, exec, ~/.config/ml4w/scripts/wlogout.sh

bind = $mainMod, D, exec, pkill rofi || rofi -show drun -replace -i
bind = $mainMod CTRL, K, exec, $HYPRSCRIPTS/keybindings.sh
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh
bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh
bind = $mainMod SHIFT, R, exec, $HYPRSCRIPTS/loadconfig.sh

bind = $mainMod, V, exec, $SCRIPTS/cliphist.sh
bind = $mainMod CTRL, T, exec, ~/.config/waybar/themeswitcher.sh
bind = $mainMod CTRL, S, exec, flatpak run com.ml4w.settings
bind = $mainMod ALT, G, exec, $HYPRSCRIPTS/gamemode.sh
bind = $mainMod CTRL, L, exec, ~/.config/hypr/scripts/power.sh lock
bind = $mainMod SHIFT, DELETE, exec, ~/.config/hypr/scripts/power.sh suspend

# -----------------------------------------------------
# Workspaces
# -----------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Tab, workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod CTRL, down, workspace, empty

# -----------------------------------------------------
# Fn keys
# -----------------------------------------------------
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-mute @DEFAULT_SINK@ 0 && pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-mute @DEFAULT_SINK@ 0 && pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

bind = , XF86Calculator, exec, ~/.config/ml4w/settings/calculator.sh
bind = , XF86Lock, exec, hyprlock

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-
