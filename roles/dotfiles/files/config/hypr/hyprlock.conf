# -----------------------------------------------------
# hyprlock :: blue glass
# Blurred wallpaper, a translucent card, a big blue clock
# and a single input field. Palette from matugen.
# -----------------------------------------------------

source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor =
    path = ~/.cache/wallpaper/blurred.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.48
    contrast = 1.05
    vibrancy = 0.15
}

# ---------- Card ----------
shape {
    monitor =
    size = 460, 420
    color = rgba(11131866)
    rounding = 28
    border_size = 1
    border_color = rgba(adc6ff33)
    position = 0, 10
    halign = center
    valign = center
    zindex = -1
}

# ---------- Clock ----------
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = $accent
    font_size = 96
    font_family = Adwaita Sans Light
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0000007a)
    shadow_boost = 1.2
    position = 0, 120
    halign = center
    valign = center
}

# ---------- Date ----------
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 15
    font_family = Adwaita Sans
    position = 0, 46
    halign = center
    valign = center
}

# ---------- Divider ----------
shape {
    monitor =
    size = 300, 1
    color = rgba(adc6ff2e)
    rounding = 0
    border_size = 0
    position = 0, 10
    halign = center
    valign = center
}

# ---------- Password ----------
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    rounding = 14
    outer_color = rgba(adc6ff3d)
    inner_color = rgba(1e1f25cc)
    font_color = $on_surface
    check_color = $accent
    fail_color = $error
    capslock_color = $tertiary
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##8e9099" size="small">Enter password</span>
    fail_text = <span foreground="##ffb4ab" size="small">Wrong password</span>
    position = 0, -50
    halign = center
    valign = center
}

# ---------- User ----------
label {
    monitor =
    text =   $USER
    color = $on_surface_variant
    font_size = 13
    font_family = Adwaita Sans
    position = 0, -110
    halign = center
    valign = center
}

# ---------- Status line (battery · keyboard layout) ----------
label {
    monitor =
    text = cmd[update:60000] echo "  $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo --)%   ·   $LAYOUT"
    color = rgba(8e9099cc)
    font_size = 12
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
